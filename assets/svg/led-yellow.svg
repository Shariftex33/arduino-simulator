<svg xmlns="http://www.w3.org/2000/svg" viewBox="46 28 68 92" width="100%" height="100%" id="led_yellow_5mm">
  <defs>
    <!-- Metallic Lead Gradients -->
    <linearGradient id="lead_grad_vertical" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a929a"/>
      <stop offset="25%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <linearGradient id="lead_grad_horizontal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Internal Metal Post Gradients -->
    <linearGradient id="internal_metal_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="40%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Translucent Resin Lens Gradients -->
    <radialGradient id="lens_body_grad" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#eab308"/>
      <stop offset="85%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#422006"/>
    </radialGradient>

    <linearGradient id="flange_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#713f12"/>
      <stop offset="20%" stop-color="#eab308"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="80%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#422006"/>
    </linearGradient>

    <radialGradient id="glow_grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="1"/>
      <stop offset="25%" stop-color="#fde047" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#facc15" stop-opacity="0.4"/>
      <stop offset="85%" stop-color="#facc15" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#facc15" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="die_glow_grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fef9c3"/>
      <stop offset="70%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0"/>
    </radialGradient>

    <!-- Specular Highlight Gradients -->
    <linearGradient id="highlight_dome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="highlight_side" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadows for Realistic Depth -->
    <filter id="drop_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="3" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.35"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft_glow_blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- MASTER COMPONENT GROUP -->
  <g id="led_component">

    <!-- DYNAMIC LIGHT EMISSION GLOW LAYER (JS Controllable) -->
    <g id="led_glow" style="opacity: 0.0; transition: opacity 0.1s ease-in-out;">
      <!-- Outer Diffused Glow -->
      <circle id="glow_outer" cx="80" cy="55" r="70" fill="url(#glow_grad)" filter="url(#soft_glow_blur)"/>
      <!-- Inner High-Intensity Core Glow -->
      <circle id="glow_core" cx="80" cy="55" r="35" fill="url(#glow_grad)"/>
      <ellipse id="glow_die_intense" cx="74" cy="58" rx="12" ry="10" fill="url(#die_glow_grad)"/>
    </g>

    <!-- PHYSICAL METAL LEADS / PINS -->
    <g id="led_pins">
      
      <!-- ANODE (+): LONG LEG WITH OFFSET BEND (LEFT SIDE) -->
      <g id="led_pin_anode">
        <!-- Lead Base Shadow -->
        <rect x="66" y="105" width="6" height="135" fill="#1e293b" opacity="0.2"/>
        
        <!-- Physical Visible Lead Path -->
        <!-- Anode originates inside body, comes out bottom, steps out, and extends long -->
        <path id="anode_lead_visual" d="
          M 66 90 
          L 66 118 
          L 62 124 
          L 62 240 
          L 68 240 
          L 68 125 
          L 72 119 
          L 72 90 
          Z" 
          fill="url(#lead_grad_vertical)" 
          stroke="#475569" 
          stroke-width="0.3"
        />
        <!-- Lead Chamfered Bottom Tip -->
        <path d="M 62 240 L 65 243 L 68 240 Z" fill="#94a3b8"/>
        
        <!-- Anode Standoff Stopper (Thicker Section near body) -->
        <rect x="65" y="102" width="8" height="6" rx="1" fill="url(#lead_grad_horizontal)" stroke="#475569" stroke-width="0.3"/>

        <!-- Connection Hotspot (Simulator Snapping Target) -->
        <circle id="anode_hotspot" cx="65" cy="240" r="8" fill="#000000" opacity="0"/>
      </g>

      <!-- CATHODE (-): SHORTER LEG (RIGHT SIDE) -->
      <g id="led_pin_cathode">
        <!-- Lead Base Shadow -->
        <rect x="88" y="105" width="6" height="115" fill="#1e293b" opacity="0.2"/>
        
        <!-- Physical Visible Lead Path -->
        <path id="cathode_lead_visual" d="
          M 88 90 
          L 88 118 
          L 88 220 
          L 94 220 
          L 94 118 
          L 94 90 
          Z" 
          fill="url(#lead_grad_vertical)" 
          stroke="#475569" 
          stroke-width="0.3"
        />
        <!-- Lead Chamfered Bottom Tip -->
        <path d="M 88 220 L 91 223 L 94 220 Z" fill="#94a3b8"/>
        
        <!-- Cathode Standoff Stopper -->
        <rect x="87" y="102" width="8" height="6" rx="1" fill="url(#lead_grad_horizontal)" stroke="#475569" stroke-width="0.3"/>

        <!-- Connection Hotspot (Simulator Snapping Target) -->
        <circle id="cathode_hotspot" cx="91" cy="220" r="8" fill="#000000" opacity="0"/>
      </g>

    </g>

    <!-- INTERNAL INTERNAL STRUCTURES (Visible through semi-transparent body) -->
    <g id="led_internal_structure" opacity="0.75">
      <!-- Anode Post (Thin lead frame extension) -->
      <path id="internal_post_anode" d="M 69 92 L 69 68 L 72 65 L 72 92 Z" fill="url(#internal_metal_grad)"/>
      <!-- Gold Bond Wire -->
      <path id="internal_bond_wire" d="M 72 65 Q 73 58 75 58" fill="none" stroke="#f59e0b" stroke-width="0.6"/>

      <!-- Cathode Anvil (Thick anvil block holding the die) -->
      <path id="internal_anvil_cathode" d="M 91 92 L 91 63 L 83 55 L 75 55 L 75 64 L 84 64 L 85 92 Z" fill="url(#internal_metal_grad)"/>
      
      <!-- Reflective Cup inside Anvil -->
      <ellipse id="led_reflector" cx="78" cy="58" rx="3.5" ry="2" fill="#e2e8f0"/>
      
      <!-- Semiconductor LED Die (Light Source Core) -->
      <rect id="semiconductor_die" x="77" y="56.5" width="2" height="2" fill="#a16207"/>
    </g>

    <!-- EXTERNAL PLASTIC EPOXY BODY -->
    <g id="led_body" filter="url(#drop_shadow)">
      
      <!-- Epox Rim / Flange Base (Flat edge on cathode side - Right) -->
      <g id="led_flange">
        <!-- Main Flange Cylindrical Body -->
        <path d="
          M 52 92 
          C 52 87, 108 87, 108 92 
          L 108 98 
          C 108 103, 52 103, 52 98 
          Z" 
          fill="url(#flange_grad)"
        />
        <!-- Cathode Flat Cut Alignment on Flange (Right Side) -->
        <path d="M 106 88 L 108 92 L 108 98 L 106 101 Z" fill="#422006" opacity="0.6"/>
        <!-- Base Bottom Lip Outline -->
        <ellipse cx="80" cy="98" rx="28" ry="5" fill="none" stroke="#713f12" stroke-width="0.5"/>
      </g>

      <!-- Main Translucent Dome Lens -->
      <path id="led_lens" d="
        M 54 92 
        L 54 50 
        A 26 26 0 0 1 106 50 
        L 106 92 
        C 106 97, 54 97, 54 92 
        Z" 
        fill="url(#lens_body_grad)" 
        opacity="0.92"
      />

    </g>

    <!-- HIGHLIGHTS & REFLECTIONS (3D Glass/Plastic Realism) -->
    <g id="led_highlights" pointer-events="none">
      <!-- Curved Top Dome Specular Highlight -->
      <path id="led_highlight_dome" d="
        M 62 42 
        A 20 20 0 0 1 92 38 
        A 22 22 0 0 0 60 48 
        A 12 12 0 0 1 62 42 
        Z" 
        fill="url(#highlight_dome)"
      />

      <!-- Left Vertical Cylindrical Highlight Streak -->
      <path id="led_highlight_left" d="
        M 57 48 
        L 57 88 
        C 57 91, 61 93, 61 90 
        L 61 50 
        C 61 47, 57 45, 57 48 
        Z" 
        fill="url(#highlight_side)"
      />

      <!-- Right Soft Rim Reflection -->
      <path id="led_highlight_right" d="
        M 102 52 
        L 102 88 
        C 102 90, 104 89, 104 87 
        L 104 54 
        C 104 51, 102 50, 102 52 
        Z" 
        fill="#ffffff" 
        opacity="0.25"
      />

      <!-- Internal Base Refraction Ring -->
      <ellipse cx="80" cy="92" rx="23" ry="3.5" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
    </g>

  </g>
</svg>
