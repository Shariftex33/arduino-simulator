    <rect x="265" y="250" width="10" height="10"/><rect x="299" y="250" width="10" height="10"/><rect x="333" y="250" width="10" height="10"/>
    <rect x="367" y="250" width="10" height="10"/><rect x="401" y="250" width="10" height="10"/><rect x="435" y="250" width="10" height="10"/>
    <rect x="469" y="250" width="10" height="10"/><rect x="503" y="250" width="10" height="10"/><rect x="537" y="250" width="10" height="10"/>
