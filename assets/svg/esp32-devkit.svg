    <rect x="258" y="118" width="210" height="64" rx="2" fill="#d1d5db" stroke="#6b7280"/>
    <text x="363" y="146" text-anchor="middle" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">ESP32-WROOM-32</text>
    <text x="363" y="164" text-anchor="middle" fill="#374151" font-family="Arial, Helvetica, sans-serif" font-size="9">DevKit V1</text>
    <path d="M548 140 h28 a16 16 0 0 1 0 20 h-28" fill="none" stroke="#d97706" stroke-width="3"/>
    <path d="M556 148 h16 a8 8 0 0 1 0 12 h-16" fill="none" stroke="#fbbf24" stroke-width="2"/>
