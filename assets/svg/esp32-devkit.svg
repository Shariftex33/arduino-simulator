<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="ESP32 DevKit">
  <defs>
    <linearGradient id="esp_pcb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="0.2" stop-color="#111827"/>
      <stop offset="1" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="esp_can" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e5e7eb"/>
      <stop offset="0.45" stop-color="#9ca3af"/>
      <stop offset="1" stop-color="#4b5563"/>
    </linearGradient>
    <linearGradient id="esp_usb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.4" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="esp_hdr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="0.35" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <rect x="70" y="24" width="630" height="252" rx="12" fill="url(#esp_pcb)" stroke="#020617" stroke-width="1.5"/>
  <rect x="72" y="26" width="626" height="248" rx="11" fill="none" stroke="rgba(255,255,255,.12)"/>

  <g fill="#0b1220" stroke="#334155" stroke-width="1.2">
    <circle cx="96" cy="46" r="6"/>
    <circle cx="676" cy="46" r="6"/>
    <circle cx="96" cy="254" r="6"/>
    <circle cx="676" cy="254" r="6"/>
  </g>

  <g id="esp_usb">
    <rect x="14" y="118" width="70" height="52" rx="3" fill="url(#esp_usb)" stroke="#334155"/>
    <rect x="28" y="130" width="42" height="28" rx="2" fill="#0f172a"/>
    <rect x="36" y="138" width="26" height="12" rx="1" fill="#e2e8f0"/>
  </g>

  <g id="esp_en">
    <rect x="98" y="58" width="20" height="20" rx="3" fill="#cbd5e1" stroke="#475569"/>
    <circle cx="108" cy="68" r="6" fill="#dc2626"/>
  </g>
  <g id="esp_boot">
    <rect x="98" y="200" width="20" height="20" rx="3" fill="#cbd5e1" stroke="#475569"/>
