  </g>
  <text x="108" y="92" text-anchor="middle" fill="#e5e7eb" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700">EN</text>
  <text x="108" y="234" text-anchor="middle" fill="#e5e7eb" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700">BOOT</text>

  <g id="esp_module">
