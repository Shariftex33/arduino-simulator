<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="pinGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#888888"/>
      <stop offset="50%" stop-color="#d0d0d0"/>
      <stop offset="100%" stop-color="#666666"/>
    </linearGradient>
    <linearGradient id="strapGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#cccccc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#aaaaaa" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="plateGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f0f0"/>
      <stop offset="50%" stop-color="#e1e1e1"/>
      <stop offset="100%" stop-color="#cccccc"/>
    </linearGradient>
    <radialGradient id="buttonGradient" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#00b300"/>
      <stop offset="50%" stop-color="#008000"/>
      <stop offset="85%" stop-color="#004d00"/>
      <stop offset="100%" stop-color="#001a00"/>
    </radialGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="buttonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <g fill="url(#pinGradient)" stroke="#444444" stroke-width="1.5">
    <rect x="22" y="66" width="30" height="12" rx="2"/>
    <rect x="18" y="70" width="8" height="4" rx="1"/>
    <rect x="22" y="122" width="30" height="12" rx="2"/>
    <rect x="18" y="126" width="8" height="4" rx="1"/>
    <rect x="148" y="66" width="30" height="12" rx="2"/>
    <rect x="174" y="70" width="8" height="4" rx="1"/>
    <rect x="148" y="122" width="30" height="12" rx="2"/>
    <rect x="174" y="126" width="8" height="4" rx="1"/>
  </g>
  <rect x="42" y="42" width="116" height="116" rx="8" fill="#333333" stroke="#222222" stroke-width="3" filter="url(#dropShadow)"/>
  <rect x="48" y="48" width="104" height="104" rx="5" fill="url(#plateGradient)" stroke="#888888" stroke-width="1.5"/>
  <rect x="48" y="64" width="104" height="16" fill="url(#strapGradient)"/>
  <rect x="48" y="120" width="104" height="16" fill="url(#strapGradient)"/>
  <g fill="#111111">
    <circle cx="58" cy="58" r="4.5"/>
    <circle cx="142" cy="58" r="4.5"/>
    <circle cx="58" cy="142" r="4.5"/>
    <circle cx="142" cy="142" r="4.5"/>
  </g>
  <circle cx="100" cy="100" r="41" fill="#262626" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="100" cy="100" r="39.5" fill="none" stroke="#4a4a4a" stroke-width="1"/>
  <g class="plunger">
    <circle cx="100" cy="100" r="38" fill="url(#buttonGradient)" filter="url(#buttonShadow)"/>
    <circle cx="100" cy="100" r="36.5" fill="none" stroke="#00b300" stroke-opacity="0.5" stroke-width="1.5"/>
  </g>
</svg>
