<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects</title>
<link rel="stylesheet" href="../css/platform.css">
</head>
<body data-depth="1">
<header class="site-header"></header>
<main>
  <div class="page-head">
    <h1>Projects</h1>
    <p class="lede">Open a circuit and that sketch loads with its wires.</p>
  </div>
  <div class="project-tools">
    <input id="project-search" type="search" placeholder="Search circuits" aria-label="Search circuits">
    <div class="filters" id="project-filters">
      <button class="filter-btn on" type="button" data-set="">All</button>
      <button class="filter-btn" type="button" data-set="build-robot">Robot</button>
      <button class="filter-btn" type="button" data-set="smart-home">Smart Home</button>
      <button class="filter-btn" type="button" data-set="line-follower">Line Follower</button>
      <button class="filter-btn" type="button" data-set="iot">IoT</button>
    </div>
  </div>
  <p class="lede" id="project-count"></p>
  <div id="project-catalog" data-root="../"></div>
</main>
<script src="../js/platform.js"></script>
<script src="../js/projects.js"></script>
</body>
</html>
